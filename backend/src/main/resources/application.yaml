# Every value that differs between laptop and Render comes from an env var,
# with a default that matches infra/docker-compose.yml for local dev.
spring:
  application:
    name: wordrush
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wordrush}
    username: ${DATABASE_USERNAME:wordrush}
    password: ${DATABASE_PASSWORD:wordrush}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches.
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never} # details leak versions/paths; enabled in the dev profile only
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

logging:
  structured:
    format:
      console: ${LOG_FORMAT:} # set LOG_FORMAT=logstash in Docker/Render for JSON logs

wordrush:
  jwt:
    secret: ${JWT_SECRET} # no default: the app refuses to start without a real secret
    ttl: 12h
    issuer: wordrush
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  room:
    ttl: 2h
  game:
    countdown: 3s
    results-pause: 5s
    idempotency-ttl: 10m
    timer-poll-millis: 250

springdoc:
  swagger-ui:
    path: /swagger-ui.html
