name: wordrush

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordrush
      POSTGRES_USER: wordrush
      POSTGRES_PASSWORD: wordrush
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordrush -d wordrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack in containers: docker compose --profile app up --build
  backend:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wordrush
      DATABASE_USERNAME: wordrush
      DATABASE_PASSWORD: wordrush
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: logstash
      JWT_SECRET: ${JWT_SECRET:-compose-local-secret-not-for-production-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
